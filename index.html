<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Space Explorer App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for clean NASA-like typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Section -->
    <header class="nasa-header">
        <div class="header-content">
            <div class="logo-area">
                <span class="nasa-worm">NASA</span>
                <h1>Space Explorer</h1>
            </div>
            <p>Discover the cosmos through NASA’s Astronomy Picture of the Day (APOD)</p>
        </div>
    </header>

    <main class="container">
        <!-- Random Space Fact Section (LevelUp) -->
        <section id="space-fact-section" class="fact-card">
            <h3>🌌 Did You Know?</h3>
            <p id="space-fact-text">Loading space fact...</p>
        </section>

        <!-- Controls Section -->
        <section class="controls-card">
            <div class="date-inputs">
                <div class="input-group">
                    <label for="start-date">Start Date:</label>
                    <input type="date" id="start-date">
                </div>
                <div class="input-group">
                    <label for="end-date">End Date:</label>
                    <input type="date" id="end-date">
                </div>
            </div>
            <button id="fetch-btn" class="nasa-btn">Get Space Images</button>
        </section>

        <!-- Loading Message -->
        <div id="loading-message" class="hidden">
            <div class="spinner"></div>
            <p>Loading space photos...</p>
        </div>

        <!-- Gallery Section -->
        <section id="gallery-container" class="gallery-grid">
            <div class="placeholder-message">
                <p>Select a date range above and click "Get Space Images" to explore the universe.</p>
            </div>
        </section>
    </main>

    <!-- Modal View -->
    <div id="apod-modal" class="modal hidden">
        <div class="modal-content">
            <span id="modal-close" class="close-btn">&times;</span>
            <div id="modal-media-container"></div>
            <h2 id="modal-title"></h2>
            <p id="modal-date" class="modal-date"></p>
            <p id="modal-explanation"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/dateRange.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
